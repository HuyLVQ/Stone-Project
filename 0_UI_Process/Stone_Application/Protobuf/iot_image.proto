syntax = "proto3";

package stone.iot.v1;

option csharp_namespace = "Stone_Application.Protobuf.Iot.V1";

// Image data is the AI-annotated frame received by IImage.recvImage.
// The image is JPEG-encoded at quality 85. Dimensions describe the decoded image.
message ImageFrame {
  uint32 schema_version = 1;
  string session_id = 2;
  uint64 sequence_number = 3;
  int64 produced_at_unix_ms = 4;
  uint32 image_width = 5;
  uint32 image_height = 6;
  string encoding = 7; // "JPEG"
  bytes jpeg_image = 8;
}

// MPEG-TS bytes contain an H.264 video stream. Chunks are ordered by
// sequence_number and must be concatenated before passing them to a decoder.
// Each chunk holds whole 188-byte TS packets. The first chunk a client
// receives starts at a keyframe. If the server falls behind or a send fails,
// it drops the backlog and resumes at a later keyframe; the gap shows up as
// a jump in sequence_number, and decoding can continue from the new chunk.
message H264TransportChunk {
  uint32 schema_version = 1;
  string session_id = 2;
  uint64 sequence_number = 3;
  int64 produced_at_unix_ms = 4;
  string container = 5; // "MPEG_TS"
  string codec = 6;     // "H264"
  bytes data = 7;
}
