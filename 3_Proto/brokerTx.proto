syntax = "proto3";

package stone.broker;

import "brokerDealer.proto";

// The transmit struct is not defined yet in 2_Broker_Process. This envelope
// provides a stable protobuf payload for TxPathPush without assuming the
// eventual processed-data fields.
message TxPushMessage {
  WorkerMessageType message_type = 1;
  optional uint64 image_result_location = 2;
  repeated float rock_percentages = 3;
  repeated float weight = 4;
  optional uint64 image_save_location = 5;
  uint64 image_location = 6;
}
